
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "custom-observability-operator.fullname" . }}-manager
  labels:
    {{- include "custom-observability-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
    - coordination.k8s.io
    resources:
    - leases
    verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps.chilkaditya.me"]
    resources: ["customobservabilitystacks"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apps.chilkaditya.me"]
    resources: ["customobservabilitystacks/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apps.chilkaditya.me"]
    resources: ["customobservabilitystacks/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules", "servicemonitors"]
    verbs: ["create", "get", "list", "patch", "update", "watch"]

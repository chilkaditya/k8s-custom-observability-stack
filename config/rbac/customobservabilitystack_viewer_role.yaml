# This rule is not used by the project k8s-observability-op itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to apps.chilkaditya.me resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8s-observability-op
    app.kubernetes.io/managed-by: kustomize
  name: customobservabilitystack-viewer-role
rules:
- apiGroups:
  - apps.chilkaditya.me
  resources:
  - customobservabilitystacks
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps.chilkaditya.me
  resources:
  - customobservabilitystacks/status
  verbs:
  - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - apps.chilkaditya.me
  resources:
  - customobservabilitystacks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.chilkaditya.me
  resources:
  - customobservabilitystacks/finalizers
  verbs:
  - update
- apiGroups:
  - apps.chilkaditya.me
  resources:
  - customobservabilitystacks/status
  verbs:
  - get
  - patch
  - update
